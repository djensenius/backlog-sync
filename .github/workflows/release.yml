name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate semver tag on main
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          semver_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$tag" =~ $semver_regex ]]; then
            echo "release tags must be semver with a leading v: $tag" >&2
            exit 1
          fi

          git fetch --force --prune origin +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "refs/tags/${tag}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "tag $tag ($tag_commit) must point to a commit on main" >&2
            exit 1
          fi
      - name: Install mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          cache: false
      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
        run: goreleaser release --clean
      - name: Check Homebrew tap release eligibility
        id: homebrew-release
        shell: bash
        run: |
          set -euo pipefail
          stable_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ "${GITHUB_REF_NAME}" =~ $stable_regex ]]; then
            echo "stable=true" >> "${GITHUB_OUTPUT}"
          else
            echo "stable=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=Homebrew tap PR skipped::${GITHUB_REF_NAME} is not a stable vMAJOR.MINOR.PATCH tag."
          fi
      - name: Generate Homebrew tap preview
        if: ${{ steps.homebrew-release.outputs.stable == 'true' }}
        run: >-
          go run ./scripts/homebrew-tap-update.go
          --version "${GITHUB_REF_NAME}"
          --checksums dist/checksums.txt
          --out-dir dist/homebrew-tap
      - name: Check Homebrew tap token
        if: ${{ steps.homebrew-release.outputs.stable == 'true' }}
        id: homebrew-token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_FINE_GRAINED_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=Homebrew tap PR skipped::Repository secret HOMEBREW_TAP_FINE_GRAINED_TOKEN is not configured; generated Formula/backlog-sync.rb and README.md preview only."
          fi
      - name: Check out Homebrew tap
        if: ${{ steps.homebrew-release.outputs.stable == 'true' && steps.homebrew-token.outputs.available == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: djensenius/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_FINE_GRAINED_TOKEN }}
          path: homebrew-tap
          fetch-depth: 0
      - name: Apply Homebrew tap update
        if: ${{ steps.homebrew-release.outputs.stable == 'true' && steps.homebrew-token.outputs.available == 'true' }}
        run: >-
          go run ./scripts/homebrew-tap-update.go
          --version "${GITHUB_REF_NAME}"
          --checksums dist/checksums.txt
          --tap-dir homebrew-tap
      - name: Validate generated Homebrew formula syntax
        if: ${{ steps.homebrew-release.outputs.stable == 'true' && steps.homebrew-token.outputs.available == 'true' }}
        run: ruby -c homebrew-tap/Formula/backlog-sync.rb
      - name: Open Homebrew tap pull request
        if: ${{ steps.homebrew-release.outputs.stable == 'true' && steps.homebrew-token.outputs.available == 'true' }}
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_FINE_GRAINED_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- Formula/backlog-sync.rb README.md)" ]; then
            echo "Homebrew tap already matches ${RELEASE_TAG}; no PR needed."
            exit 0
          fi
          branch="backlog-sync-${RELEASE_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add Formula/backlog-sync.rb README.md
          git commit -m "Update backlog-sync to ${RELEASE_TAG}"
          git push --force-with-lease origin "${branch}"
          gh pr create \
            --repo djensenius/homebrew-tap \
            --base main \
            --head "${branch}" \
            --title "Update backlog-sync to ${RELEASE_TAG}" \
            --body "Updates Formula/backlog-sync.rb and the tap README for ${RELEASE_TAG}. Generated from djensenius/backlog-sync release assets and checksums."
