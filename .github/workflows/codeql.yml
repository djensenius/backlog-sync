name: CodeQL

on:
  pull_request:
  schedule:
    - cron: '24 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Initialize CodeQL
        uses: github/codeql-action/init@87ef0dc97def48aa960fbf026a2563ee9dbdb470
        with:
          languages: go
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@87ef0dc97def48aa960fbf026a2563ee9dbdb470
